{%- comment -%} Renders one entry in a post listing. {%- endcomment -%}
<li>
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  <time class="meta" datetime="{{ include.post.date | date_to_xmlschema }}">
    {{ include.post.date | date: "%-d %B %Y" }}
  </time>
  <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 160 }}</p>
</li>
